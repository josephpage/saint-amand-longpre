name: Déploiement

# Construit le site à partir du WordPress de production et le publie sur Cloudflare.
on:
  push:
    branches: [main]
  # Déclenché par WordPress après chaque publication (mu-plugin sal-headless).
  repository_dispatch:
    types: [contenu-modifie]
  # Chaque nuit : retire les alertes expirées et bascule les évènements passés.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build et publication
    # Activé une fois la production prête (variable de dépôt DEPLOY_ENABLED = true, voir docs/runbook.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ENV: production
      SITE_URL: https://www.saintamandlongpre.fr
      WP_GRAPHQL_URL: https://cms.saintamandlongpre.fr/graphql
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build depuis WordPress
        run: pnpm --filter @sal/web build
      - name: Publication sur Cloudflare Pages
        run: pnpm --filter @sal/web exec wrangler pages deploy --branch main --commit-dirty=true
